paper_API_KEY:  paper_API_KEY
paper_SECRET_KEY: paper_SECRET_KEY
api_key: api_key
secret_key: secret_key
binance_api_key: binance_api_key
binance_api_secret: binance_api_secret
symbols:
  - BTC/USDT    # Bitcoin / USDT

start_date:     '2023-01-01'
end_date:        '2024-12-31'

n_trials: 2000

checks:
  perm_delta       : 0.10

grid:
  # ── model architecture ───────────────────────────────
  seq_len:       [3, 5, 8, 13, 21]
  horizon:       [3, 5, 8, 13]
  num_layers:    [3]
  hidden_size:   [32]
  dropout:       [0.30]

  # ── training / optimiser ─────────────────────────────
  max_epochs:        [30]
  lr:            [0.0005]
  weight_decay:  [0.0001]
  batch_size:    [128]
  patience:      [5]

  # ── feature engineering ──────────────────────────────
  ma_window:     [15, 20, 30, 40]
  take_k:        [0.5, 1.5]
  rolling_size:       [50, 100, 200]
  stop_k:       [0.5, 1.5]
  entry_k:      [0.5, 1.5]
